<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101211" />
    <meta name="description" content="The quiet won't last. A world rooted in Tezos. Fork War. Coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fork War · The quiet won't last." />
    <meta property="og:description" content="Athens remembers. The next cycle is coming. A world rooted in Tezos." />
    <meta property="og:image" content="https://primate411.github.io/forkwar.games/social.jpg" />
    <meta property="og:image:alt" content="Fork War. The quiet won't last. An ancient arena bearing the Tezos sigil." />
    <meta property="og:url" content="https://primate411.github.io/forkwar.games/" />
    <link rel="canonical" href="https://primate411.github.io/forkwar.games/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Fork War · Coming Soon</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="site-shell">
      <div class="grain" aria-hidden="true"></div>
      <header class="masthead">
        <a class="brand" href="./" aria-label="Fork War home">
          <svg viewBox="0 0 40 44" aria-hidden="true"><path d="M6 2v13l14 10v17M34 2v13L20 25M20 2v13"/></svg>
          <span>FORK<span class="brand-war">WAR</span><small>GAMES</small></span>
        </a>
        <span class="header-note">EXPECT RESISTANCE.</span>
        <div class="release"><i></i><span>IN DEVELOPMENT</span></div>
      </header>

      <main id="main">
        <section class="hero" aria-labelledby="hero-title">
          <div class="scene-wrap" id="scene-wrap">
            <div class="scene-fallback" aria-hidden="true"></div>
            <div id="battlefield" role="img" aria-label="A cinematic glimpse of distant combat, silhouettes and energy in an ancient arena with a Tezos sigil inlaid in its floor."></div>
            <div class="scene-shade" aria-hidden="true"></div>
            <div class="scene-vignette" aria-hidden="true"></div>
          </div>

          <div class="hero-copy">
            <div class="eyebrow"><span class="tiny-cross">+</span> THE NEXT CYCLE IS COMING</div>
            <h1 id="hero-title"><span>FORK</span><span class="war-line">WAR<span class="title-period">.</span></span></h1>
            <p class="hero-tagline">The quiet<br>won’t last.</p>
            <button class="watch-button" id="watch"><span class="play-icon" aria-hidden="true">▶</span><span>WATCH THE SIGNAL</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button>
            <div class="launch-note"><span class="small-diamond"></span> COMING SOON</div>
          </div>

          <div class="battle-label" aria-hidden="true"><span class="bracket">[</span><span>SIGNAL DETECTED<small>ORIGIN: ATHENS</small></span><span class="bracket">]</span></div>
          <div class="scene-loading" id="scene-loading">ACQUIRING SIGNAL<span></span></div>

          <div class="battle-hud" id="battle-hud">
            <div class="hud-top"><span><i></i> <span id="sequence-label">INTERCEPTED TRANSMISSION</span></span><span id="sequence-number">00:00</span></div>
            <div class="sequence-track"><div id="sequence-progress"></div></div>
          </div>

          <div class="cinema-heading" aria-hidden="true"><span>ATHENS REMEMBERS</span><strong>Even the rules<br>can be rewritten.</strong></div>
          <button class="exit-cinema" id="exit-cinema" hidden><span aria-hidden="true">↙</span> BACK TO THE SURFACE</button>
          <div class="scene-controls">
            <button id="sound" class="icon-control" aria-label="Enable battle sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5ZM16 9l5 6m0-6-5 6"/></svg><span>SOUND OFF</span></button>
            <span class="control-divider"></span>
            <button id="pause" class="icon-control" aria-label="Pause animation" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span>PAUSE</span></button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-manifesto"><span>FW / 001</span><span class="tezos-origin"><img src="/src/tezos-mark.svg" alt="" width="11" height="16"> ROOTED IN TEZOS.</span></div>
        <div class="footer-right"><span>STAY CLOSE.</span><svg viewBox="0 0 25 25" aria-hidden="true"><path d="M1 12.5h23M12.5 1v23M4 4l17 17M4 21 21 4"/></svg></div>
      </footer>
    </div>
    <noscript><p class="noscript">Fork War. The quiet won’t last. Rooted in Tezos. Coming soon. Enable JavaScript to watch the signal.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
